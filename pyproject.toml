[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cake-agent"
version = "0.1.0"
description = "Unofficial reproduction of CAKE: Compiler-Agent Co-Design for Frontier Kernel Evolution (arXiv:2608.12629), on a simulated GPU"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
cake = "cake.cli:main"

[tool.setuptools.packages.find]
include = ["cake*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
